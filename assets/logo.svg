    <circle cx="25" cy="25" r="22" stroke="#1A2233" stroke-width="1.5" />
    <!-- Inner Decorative Geometry -->
    <circle cx="25" cy="25" r="18" stroke="#1A2233" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.4" />
    
    <!-- 8-point geometric luxury star -->
    <!-- Primary Diamond -->
    <path d="M 25 7 L 29 21 L 43 25 L 29 29 L 25 43 L 21 29 L 7 25 L 21 21 Z" fill="#1A2233" />
